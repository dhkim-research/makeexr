name: Windows build

# Builds makeexr.exe (OpenEXR and the C runtime linked statically, so it runs on any
# 64-bit Windows without installing anything) and checks the conversion numerically.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAKEEXR_BUILD_TESTS=ON
          cmake --build build
      - name: Only system DLLs are needed
        shell: pwsh
        run: |
          $deps = dumpbin /dependents build/makeexr.exe | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() }
          $deps
          $other = $deps | Where-Object { $_ -notmatch '^(KERNEL32|ADVAPI32|USER32|api-ms-win-.*|ucrtbase|WS2_32|bcrypt|SHELL32|ole32)\.dll$' }
          if ($other) { throw "unexpected DLL dependencies: $other" }
      - name: Convert and check the values
        shell: pwsh
        run: |
          python tests/make_test_hdr.py test.hdr
          # cmd.exe redirection, the usage the README shows
          cmd /c "build\makeexr.exe test.hdr > redirected.exr"
          if ($LASTEXITCODE -ne 0) { throw "makeexr failed" }
          # output file as the second argument: same bytes as the redirected output
          build/makeexr.exe test.hdr file.exr
          if ($LASTEXITCODE -ne 0) { throw "makeexr failed" }
          if ((Get-FileHash redirected.exr).Hash -ne (Get-FileHash file.exr).Hash) { throw "the two outputs differ" }
          # non-ASCII names with a space (the EXR comment then names this file, so compare pixels)
          Copy-Item test.hdr "테스트 사진.hdr"
          build/makeexr.exe "테스트 사진.hdr" "결과 사진.exr"
          if ($LASTEXITCODE -ne 0) { throw "makeexr failed with a Korean file name" }
          Copy-Item "결과 사진.exr" korean.exr   # exrdump (a test helper) takes ASCII names only
          build/exrdump.exe korean.exr > dump_korean.txt
          build/exrdump.exe redirected.exr > dump.txt
          Get-Content dump.txt -TotalCount 7
          python tests/check.py test.hdr dump.txt
          if ($LASTEXITCODE -ne 0) { throw "values differ" }
          python tests/check.py test.hdr dump_korean.txt
          if ($LASTEXITCODE -ne 0) { throw "values differ (Korean file name)" }
      - name: Files dropped on makeexr.exe (own console window, several files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory "drop 폴더" | Out-Null
          Copy-Item test.hdr "drop 폴더/첫째.hdr"; Copy-Item test.hdr "drop 폴더/second.hdr"
          Set-Content enter.txt ""
          $a = (Resolve-Path "drop 폴더/첫째.hdr").Path; $b = (Resolve-Path "drop 폴더/second.hdr").Path
          # Explorer starts the program in a new console with the dropped paths; Enter closes it
          $p = Start-Process build/makeexr.exe -ArgumentList "`"$a`" `"$b`"" -RedirectStandardInput enter.txt -Wait -PassThru
          "exit code $($p.ExitCode)"
          Get-ChildItem "drop 폴더" | Format-Table Name, Length
          if ($p.ExitCode -ne 0) { throw "makeexr failed" }
          build/exrdump.exe "drop 폴더/second.exr" > dump_second.txt
          python tests/check.py test.hdr dump_second.txt
          if ($LASTEXITCODE -ne 0) { throw "values differ (second dropped file)" }
          Copy-Item "drop 폴더/첫째.exr" first.exr
          build/exrdump.exe first.exr > dump_drop.txt
          python tests/check.py test.hdr dump_drop.txt
          if ($LASTEXITCODE -ne 0) { throw "values differ (dropped file)" }
      - name: Redirection in PowerShell (information only)
        shell: pwsh
        continue-on-error: true
        run: |
          build/makeexr.exe test.hdr > ps7.exr
          powershell.exe -NoProfile -Command "build\makeexr.exe test.hdr > ps5.exr"
          $ref = (Get-FileHash file.exr).Hash
          "PowerShell $($PSVersionTable.PSVersion) '>': " + $(if ((Get-FileHash ps7.exr).Hash -eq $ref) { "same bytes" } else { "different bytes" })
          "Windows PowerShell 5.1 '>': " + $(if ((Get-FileHash ps5.exr).Hash -eq $ref) { "same bytes" } else { "different bytes" })
      - uses: actions/upload-artifact@v4
        with:
          name: makeexr-windows-x64
          path: |
            build/makeexr.exe
            README.md
            LICENSE
